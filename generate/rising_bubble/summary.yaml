schema_version: 5
case: rising_bubble
campaign_entry: generate/job.sh

runners:
  VOF-HF: generate/rising_bubble/VOF-HF.sh
  CLSVOF: generate/rising_bubble/CLSVOF.sh
  NN: generate/rising_bubble/NN.sh

sources:
  stock_case: basilisk/src/test/rising.c

formal_matrix:
  benchmark_cases: [hysing_case_1, hysing_case_2]
  resolutions: [32, 64, 128, 256, 512]
  actual_grid: N_by_N_over_4
  default_imax: 3
  sensitivity_imax: [0, 1, 2, 4, 5, 10, 15, 20]
  grid_strategy: uniform
  methods: [CLSVOF, NN]
  rows: 180
  vof_hf_rows: 10

outputs:
  final: [manifest.json, timeseries.csv, interface_t3.csv.gz, fields.csv.gz, run.log]
  intermediate_validated_then_removed: [history.dat, interface.dat, circularity.csv, metrics.csv, plot_data.csv]
  shared_reference: _meta/references/hysing/

official_difference:
  role: formal_vof_hf_reference_separate_from_180_paired_rows
  resolutions: [32, 64, 128, 256, 512]
  stock_method: VOF height-function curvature
  stock_default_grid: 256x64
  generated_method: single-grid LEVELSET plus CLSVOF with requested imax
  extension: grids other than 256x64 are source-compatible grid extensions
  nn_change: only the active distance_curvature provider is replaced

completion_gate:
  terminal_time: 3
  check: history and circularity both span t=0 through t=3 and final facets exist
