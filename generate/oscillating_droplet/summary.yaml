schema_version: 5
case: oscillating_droplet
campaign_entry: generate/job.sh

runners:
  VOF-HF: generate/oscillating_droplet/VOF-HF.sh
  CLSVOF: generate/oscillating_droplet/CLSVOF.sh
  NN: generate/oscillating_droplet/NN.sh

sources:
  stock_case: basilisk/src/test/oscillation.c
  generated_host: generate/oscillating_droplet/nn/generate/make_official_method_host.py
  sign_adapter: generate/oscillating_droplet/nn/src/oscillation_raw27_adapter.h

formal_matrix:
  resolutions: [32, 64, 128, 256, 512]
  default_imax: 3
  sensitivity_imax: [0, 1, 2, 4, 5, 10, 15, 20]
  grid_strategy: {official_VOF-HF: adaptive, matched_VOF-HF: uniform, CLSVOF: uniform, NN: uniform}
  methods: [CLSVOF, NN]
  rows: 90
  vof_hf_rows: 10

outputs:
  final: [manifest.json, timeseries.csv, fit.csv, fields.csv.gz, run.log]
  intermediate_validated_then_removed: [timeseries.dat, fit_curve.dat, fit.log, error.dat, laplace.dat, metrics.csv, plot_data.csv]
  official_vof_hf_status: embedded_in_manifest_and_campaign_rollup

official_difference:
  role: adaptive_official_reference_plus_uniform_matched_reference_for_90_paired_rows
  resolutions: [32, 64, 128, 256, 512]
  selected_solver_variant: Standard
  excluded_solver_variants: [Momentum, Compressible]
  stock_grid_suite: [16, 32, 64, 128]
  generated_method: one uniform centered-solver CLSVOF level with requested imax
  matched_comparison: uniform VOF-HF, CLSVOF and NN at every requested N
  extension: adaptive N256/N512 are outside the stock grid suite; all uniform rows are matched experiments
  nn_change: only the active curvature provider is replaced through the sign adapter

completion_gate:
  terminal_time: 1
  check: kinetic history reaches the horizon and all stock fit channels parse; no extra residual or R2 threshold
