schema_version: 5
case: capwave
campaign_entry: generate/job.sh

runners:
  VOF-HF: generate/capwave/VOF-HF.sh
  CLSVOF: generate/capwave/CLSVOF.sh
  NN: generate/capwave/NN.sh

sources:
  stock_case: basilisk/src/test/capwave.c
  prosperetti_reference: basilisk/src/test/prosperetti.h

formal_matrix:
  resolutions: [32, 64, 128, 256, 512]
  default_imax: 3
  sensitivity_imax: [0, 1, 2, 4, 5, 10, 15, 20]
  grid_strategy: uniform
  methods: [CLSVOF, NN]
  rows: 90
  vof_hf_rows: 5

outputs:
  final: [manifest.json, timeseries.csv, fields.csv.gz, run.log]
  intermediate_validated_then_removed: [wave.dat, official_error.dat, metrics.csv, plot_data.csv]
  shared_reference: _meta/references/prosperetti.h

official_difference:
  role: formal_vof_hf_reference_separate_from_90_paired_rows
  resolutions: [32, 64, 128, 256, 512]
  stock_method: VOF height-function curvature
  stock_grid_suite: [16, 32, 64, 128]
  generated_method: single-resolution CLSVOF with requested imax
  extension: N256 and N512 are outside the stock grid suite
  nn_change: only the active distance_curvature provider is replaced

completion_gate:
  samples: 738
  check: recomputed Prosperetti relative RMS equals the benchmark diagnostic
