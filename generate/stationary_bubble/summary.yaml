schema_version: 5
case: stationary_bubble
campaign_entry: generate/job.sh

runners:
  VOF-HF: generate/stationary_bubble/VOF-HF.sh
  CLSVOF: generate/stationary_bubble/CLSVOF.sh
  NN: generate/stationary_bubble/NN.sh

sources:
  stock_case: basilisk/src/test/spurious.c
  vof_hf_host: generate/stationary_bubble/src/make_fixed_horizon_vof_host.py
  clsvof_case: generate/stationary_bubble/src/stationary-clsvof.c
  whole_domain_case: generate/stationary_bubble/src/stationary-bubble-whole.c

formal_matrix:
  resolutions: [32, 64, 128, 256]
  default_imax: 0
  sensitivity_imax: []
  grid_strategy: {VOF-HF: adaptive, CLSVOF: uniform, NN: uniform}
  methods: [CLSVOF, NN]
  tau_milestone: 1
  tau_max: 2
  rows: 8
  vof_hf_rows: 4

outputs:
  final: [manifest.json, timeseries.csv, milestones.csv, fields.csv.gz, run.log]
  intermediate_validated_then_removed: [timeseries.dat, termination.csv, official_terminal.dat, metrics.csv, plot_data.csv]
  provider_stats: embedded_in_manifest_for_nn

official_difference:
  role: formal_vof_hf_reference_separate_from_8_paired_rows
  resolutions: [32, 64, 128, 256]
  stock_method: VOF and CSF using volume fraction c
  stock_la12000_grid_suite: [8, 16, 32, 64, 128]
  vof_hf_horizon: fixed_tau_2_with_tau_1_milestone
  generated_method: CLSVOF signed distance d at a fixed horizon
  extension: N256 is outside the stock grid suite; N512 is excluded
  nn_change: only the active distance_curvature provider is replaced

completion_gate:
  canary_tau: 2
  formal_tau: 2
  check: every method has tau=1 and tau=2 method-aware curvature milestones

whole_domain:
  selection: --domain whole
  bounds: [-1, 1, -1, 1]
  radius: 0.4
  resolution_definition: inverse_grid_spacing_and_model_resolution
  grid_spacing: 1/resolution
  cells_per_side: 2*resolution
  matched_model_resolution: resolution
  boundary_conditions: symmetry_on_all_outer_boundaries
  campaign_membership: separate_extension
  timing_seconds: [compile_seconds, solver_seconds, elapsed_seconds]
