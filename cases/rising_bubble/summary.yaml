case: rising_bubble
solver: basilisk

sources:
  clsvof: basilisk/src/test/rising.c
  moonmd: dataset/official_data/rising_bubble/sources

generators:
  official:
    status: to_relocate
    target: cases/rising_bubble/generate/official.sh
  nn_cell_offset:
    status: runnable
    scope: [hysing_case_1, hysing_case_2]
    target: cases/rising_bubble/generate/nn_cell_offset.sh
    arguments:
      imax: [0, 1, 2, 3, 4, 5]
      case: [1, 2]
  native:
    status: runnable
    scope: [hysing_case_1, hysing_case_2]
    target: cases/rising_bubble/generate/native.sh

datasets:
  official:
    current: dataset/official_data/rising_bubble
    target: dataset/rising_bubble/official
    role: reference
  legacy_nn_direct:
    current: dataset/nn_data/rising-clsvof
    target: dataset/rising_bubble/legacy_nn_direct
    role: audit_only
  nn_cell_offset_matched:
    target: dataset/rising_bubble/nn_cell_offset_matched
    role: pending_formal
    imax: 3
  nondefault_redistance:
    target: dataset/rising_bubble/nondefault_redistance
    role: sensitivity
    imax: [0, 1, 2, 4, 5]

figures:
  official_reproduction: figures/rising_bubble/official_reproduction
  redistance_sensitivity: figures/nondefault_redistance/rising_bubble

report_figures: report/figures
