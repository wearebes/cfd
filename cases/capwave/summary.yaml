case: capwave
solver: basilisk

sources:
  vof: basilisk/src/test/capwave.c
  clsvof: basilisk/src/test/capwave-clsvof.c
  prosperetti: basilisk/src/test/prosperetti.h
  n512_extension: basilisk/src/test/capwave-n512.c

generators:
  official_vof:
    status: to_relocate
    current: tools/capwave
    target: cases/capwave/generate/official_vof.sh
  official_clsvof:
    status: to_relocate
    target: cases/capwave/generate/official_clsvof.sh
  nn_cell_offset:
    status: runnable
    target: cases/capwave/generate/nn_cell_offset.sh
    arguments:
      imax: [0, 1, 2, 3, 4, 5]
  native:
    status: runnable
    target: cases/capwave/generate/native.sh

datasets:
  official_vof:
    current: dataset/official_data/capwave/raw/official_vof
    target: dataset/capwave/official_vof
    role: reference
  official_clsvof:
    current: dataset/official_data/capwave/raw/official_clsvof
    target: dataset/capwave/official_clsvof
    role: reference
    imax: 3
  legacy_nn_direct:
    current: experiments/capwave_clsvof_kreplace/results
    target: dataset/capwave/legacy_nn_direct
    role: audit_only
  nn_cell_offset_matched:
    target: dataset/capwave/nn_cell_offset_matched
    role: pending_formal
    imax: 3
  nondefault_redistance:
    target: dataset/capwave/nondefault_redistance
    role: sensitivity
    imax: [0, 1, 2, 4, 5]

figures:
  official_reproduction: figures/capwave/official_reproduction
  amplitude: figures/capwave/amplitude
  rms_convergence: figures/capwave/rms_convergence
  redistance_sensitivity: figures/nondefault_redistance/capwave

report_figures: report/figures
