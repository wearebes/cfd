name: Ubuntu HPC fresh clone

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap Basilisk
        run: bash hpc/bootstrap_ubuntu.sh

      - name: Python and contract tests
        run: python3 -m pytest hpc/tests generate -q

      - name: Compile and run OpenMP statistics parity
        run: |
          gcc -std=c11 -O2 -Igenerate/_shared/nn_runtime/src generate/_shared/nn_runtime/tests/openmp_stats_smoke.c -o /tmp/stats_serial -lm
          gcc -std=c11 -O2 -fopenmp -Igenerate/_shared/nn_runtime/src generate/_shared/nn_runtime/tests/openmp_stats_smoke.c -o /tmp/stats_openmp -lm
          /tmp/stats_serial 100003 > /tmp/stats_serial.txt
          OMP_NUM_THREADS=4 OMP_DYNAMIC=FALSE /tmp/stats_openmp 100003 > /tmp/stats_openmp.txt
          python3 -m pytest generate/_shared/nn_runtime/tests/test_openmp_stats.py -q

      - name: N64 generator smoke matrix
        run: |
          bash generate/capwave/clsvof.sh --smoke --imax 3 --resolution 64 --threads 1 --output /tmp/cap_clsvof
          bash generate/capwave/nn.sh --smoke --imax 3 --resolution 64 --threads 2 --output /tmp/cap_nn
          bash generate/rising_bubble/clsvof.sh --case 1 --smoke --imax 3 --resolution 64 --threads 2 --output /tmp/rising1_clsvof
          bash generate/rising_bubble/nn.sh --case 1 --smoke --imax 3 --resolution 64 --threads 2 --output /tmp/rising1_nn
          bash generate/rising_bubble/clsvof.sh --case 2 --smoke --imax 3 --resolution 64 --threads 4 --output /tmp/rising2_clsvof
          bash generate/rising_bubble/nn.sh --case 2 --smoke --imax 3 --resolution 64 --threads 4 --output /tmp/rising2_nn
          bash generate/stationary_bubble/clsvof.sh --smoke --imax 3 --resolution 64 --tau-max 0.001 --threads 1 --output /tmp/stationary_clsvof
          bash generate/stationary_bubble/nn.sh --smoke --imax 3 --resolution 64 --tau-max 0.001 --threads 1 --output /tmp/stationary_nn
